# LogStream の release を作る。VRChat の template-package の release.yml と同じ形で、Unity は使わない。
# 手で起こし、版は Packages/dev.kmnk.log-stream/package.json の version から読む。手順は docs/release.md。
# dry_run が true（既定）のときは、tag・Release・listing の作り直しをせず、作ったものを artifact に上げるだけにする。
name: Build Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら tag・Release・listing を作らず、artifact に上げるだけにする"
        type: boolean
        default: true

permissions:
  contents: write

env:
  packageName: dev.kmnk.log-stream
  packagePath: Packages/dev.kmnk.log-stream
  # secrets は if で読めないので、有無だけを env に移す
  hasVpmReposToken: ${{ secrets.VPM_REPOS_TOKEN != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version
        id: version
        run: |
          version="$(jq -r .version "$packagePath/package.json")"
          name="$(jq -r .name "$packagePath/package.json")"
          if [ "$name" != "$packageName" ]; then
            echo "package.json の name が $packageName でない: $name" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "zipFile=$packageName-$version.zip"
            echo "unityPackage=$packageName-$version.unitypackage"
            echo "boothZip=VRChat_LogStream_v${version//./_}.zip"
            echo "version=$version"
          } >> "$GITHUB_ENV"

      - name: Stop if the tag already exists
        if: ${{ !inputs.dry_run }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "tag $version は既にある。package.json の version を上げてから動かす" >&2
            exit 1
          fi

      - name: Pick the release notes from CHANGELOG.md
        run: |
          # dry run は版を上げる前に動かすので、[Unreleased] を使う
          section="$version"
          if [ "${{ inputs.dry_run }}" = "true" ] && ! python3 bin/lib/changelog_section.py "$packagePath/CHANGELOG.md" "$version" >/dev/null 2>&1; then
            section=Unreleased
          fi
          python3 bin/lib/changelog_section.py "$packagePath/CHANGELOG.md" "$section" > release-notes.md
          cat release-notes.md

      - name: Create the VPM zip
        working-directory: ${{ env.packagePath }}
        run: zip -r "$GITHUB_WORKSPACE/$zipFile" .

      - name: Track package meta files
        run: find "$packagePath/" -name '*.meta' > metaList

      - name: Create the unitypackage
        uses: pCYSl5EDgo/create-unitypackage@b5c57408698b1fab8b3a84d4b67f767b8b7c0be9 # v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList

      - name: Create the zip for Booth and manual install
        run: |
          mkdir booth
          cp "$unityPackage" "$packagePath/README.md" "$packagePath/README_ja.md" "$packagePath/LICENSE.md" booth/
          (cd booth && zip "$GITHUB_WORKSPACE/$boothZip" ./*)
          unzip -l "$boothZip"

      - name: Compare with the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release list --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName' | grep -vx "$version" | head -1)"
          if [ -z "$previous" ]; then
            echo "直前の release が無い" >&2
            exit 1
          fi
          mkdir previous
          gh release download "$previous" --pattern '*.unitypackage' --dir previous
          bin/compare-package --ignore Assets/Kmnk/Core --ignore-item Assets/Kmnk/LogStream "$unityPackage" previous/*.unitypackage

      - name: Upload the files (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.version }}
          path: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.boothZip }}
            ${{ env.packagePath }}/package.json
            release-notes.md

      - name: Make the release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.version }}
          name: ${{ env.version }}
          body_path: release-notes.md
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.boothZip }}
            ${{ env.packagePath }}/package.json

      - name: Rebuild the VPM listing
        if: ${{ !inputs.dry_run && env.hasVpmReposToken == 'true' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.VPM_REPOS_TOKEN }}
          repository: kmnk/vpm-repos
          event-type: build-listing

      - name: Remind to rebuild the listing by hand
        if: ${{ !inputs.dry_run && env.hasVpmReposToken != 'true' }}
        run: echo "::notice::VPM_REPOS_TOKEN が無いので listing を作り直していない。gh workflow run build-listing.yml -R kmnk/vpm-repos を動かす"
